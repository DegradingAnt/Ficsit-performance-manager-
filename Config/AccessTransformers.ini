[AccessTransformers]

; ══ BEFORE ADDING AN ENTRY: PROVE THE MEMBER IS ACTUALLY NON-PUBLIC ══
;
; Every line here rewrites an engine or FactoryGame header at build time, and an entry that grants
; nothing still widens the surface a conflict audit has to reason about. Two entries were removed on
; 2026-08-10 because the members they reached for turned out to be PUBLIC all along:
;
;  - AGameMode::InactivePlayerArray (FFPMCloneSensor) — GameMode.h:138, inside the `public:` at :106.
;    The next specifier is the `protected:` at :140, which is what the old comment had misread. There
;    is no public ENUMERATOR, which is true and is a different thing from the field being non-public.
;  - ARecastNavMesh::TileNumberHardLimit (FFPMNavMeshCeiling) — RecastNavMesh.h:752. The class opens
;    with GENERATED_UCLASS_BODY() at :571, and that macro ends in `public:`
;    (RecastNavMesh.generated.h:74-81, `..._571_GENERATED_BODY_LEGACY`). No specifier follows before
;    :752, so the field is public — the old comment cited the `protected:` at :490, which belongs to
;    the nested struct FNavMeshTileData::FNavData and closes at :493.
;
; The check that would have caught both: read the access specifier that GOVERNS the line, not the
; nearest one above it, and remember GENERATED_UCLASS_BODY() leaves `public:` while GENERATED_BODY()
; leaves `private:`. Deleting the entry and getting a clean compile is the receipt, same as adding one.
;
; ══ ⚠ AN ENGINE CLASS CANNOT BE FRIENDED FROM HERE AT ALL. NOT "DISCOURAGED" — IT DOES NOT WORK. ══
;
; The transformer is a UBT plugin that injects `friend class X;` into the UHT-GENERATED header, not into
; the header you read on disk. Receipts, all measured 2026-08-10:
;
;   Intermediate/Build/Win64/UnrealEditor/Inc/FactoryGame/UHT/FGCircuitConnectionComponent.generated.h:58
;       friend class FFPMWireNullGuard;          <- a FactoryGame target. It works.
;   Intermediate/Build/Win64/UnrealEditor/Inc/FactoryGame/UHT/FGInventoryComponent.generated.h:153
;       friend class FFPMInventoryInitGuard;     <- same.
;   <engine>/Intermediate/Build/Win64/UnrealEditor/Inc/Engine/UHT/GameMode.generated.h
;   <engine>/Intermediate/Build/Win64/UnrealEditor/Inc/NavigationSystem/UHT/RecastNavMesh.generated.h
;       zero FPM friends, both dated 2026-06-02 — they SHIP with the installed engine and this project's
;       UHT never regenerates them.
;
; So the two removed entries were not merely redundant, they were inert from the day they were written,
; and the code compiled the whole time because both members are public. Had either been genuinely
; non-public, the entry would have bought nothing and the build would have failed instead.
;
; Every remaining entry in this file targets a FactoryGame class. Keep it that way. If a fix ever needs
; a non-public ENGINE member, this file is not the route and finding another one is the task.
;
; Access transformers remain the docs-recommended route over stringly-typed FProperty reflection where
; a FactoryGame member IS non-public: they fail at BUILD time if the game renames the field, not
; silently at runtime.

; mCachedAttachmentPoints is protected on AFGBuildableHologram (FGBuildableHologram.h:523) and — unlike
; almost everything else we reach for — it is NOT a UPROPERTY, just a plain TArray. So FProperty
; reflection is not even an available fallback here; the friend is the only route.
;
; ⚠ THIS ONE WRITES, which is a real difference from the read-only sensor above. The array is derived
; locally during the placement flow and never replicated, so an observer's network-received build
; preview arrives with the attachment-point COMPONENTS present and the cache that summarises them
; empty. ModularStations' carousel hologram asserts on that emptiness and kills the joining client. We
; rebuild the cache from those components and let BeginPlay run.
;
; Writing it is safe because a ROLE_SimulatedProxy never makes a placement decision — snapping is
; resolved on the owning machine and committed by the server — so the cache on an observer copy is read
; only by code that expects it populated. The alternative, which shipped for two weeks, was cancelling
; DispatchBeginPlay outright; that also skipped every COMPONENT's BeginPlay, and Ant confirmed the cost
; first-hand: "sometimes the holograms never rendered when sunfry held them in front of me."
Friend=(Class="AFGBuildableHologram", FriendClass="FFPMHologramNetGuard")

; mDefaultInventorySize is protected on UFGInventoryComponent (FGInventoryComponent.h:622). It is the
; authored slot count an inventory is supposed to have, and reading it is what lets the init guard
; REPAIR a zero-slot inventory instead of refusing the items headed into it.
;
; Ant, 2026-08-08, on the old guard's Override(0): "we cant delete items. illegal. we need to not make
; zero inventory crates at all. it needs to be fixed at the source, not a bandaid solution."
;
; ⚠ READ-ONLY. The guard reads this to learn the intended size, then calls the PUBLIC Resize()
; (FGInventoryComponent.h:203) to apply it. It never writes the field.
Friend=(Class="UFGInventoryComponent", FriendClass="FFPMInventoryInitGuard")

; mWires is non-public on UFGCircuitConnectionComponent (FGCircuitConnectionComponent.h:184,
; `TArray<TObjectPtr<AFGBuildableWire>> mWires`). The public accessors are both named GetWires (:72,
; :73) and they APPEND INTO A COPY — so they can tell you a null exists and can never remove it. The
; sibling `uint8 mNumWiresConnected` (:188) is read through the same friend.
;
; ⚠ THIS ONE WRITES, and it earned the right the hard way. On 2026-08-09 at 21:42:41 a null entry in
; one of these arrays SIGSEGV'd the DEDICATED SERVER inside its autosave — UClass::ImplementsInterface
; on a null class, called from FFastSaveReferenceCollector::HandleObjectReference (FGSaveSession.cpp:
; 2577) — with two players connected, and autosaves had been silently failing before that.
;
; What it writes is deliberately the narrowest possible thing: RemoveAll of entries that are EXACTLY
; nullptr. It never destroys an AFGBuildableWire, never touches a buildable, a player character or an
; item, and never writes an ini. A null slot is a hole where an object used to be, not a player's
; property — which is why this does not collide with "we cant delete items. illegal."
; mNumWiresConnected is READ AND REPORTED BUT NEVER WRITTEN: its exact semantics (array slots, or only
; wires connected at both ends?) are unverified, and writing on that uncertainty is the class of guess
; this project keeps paying for.
;
; FPM.WireGuard.Repair 0 returns it to report-only without losing the half that names the culprit.
;
; The friend is the FIX CLASS, per this file's convention — the access happens in
; FFPMWireNullGuard::SweepWorld, so that member carries it.
Friend=(Class="UFGCircuitConnectionComponent", FriendClass="FFPMWireNullGuard")

; SaveWorldEndOfFrame is PRIVATE on UFGSaveSession (FGSaveSession.h:593, under the `private:` at :584)
; and the class friends only AFGGameMode, UFGMapUtility, FWPSaveDataMigrationContext and
; FFGSaveSystemBackgroundSaveGameAsyncTask. Taking its address for SUBSCRIBE_METHOD needs access, so
; the friend is the route.
;
; ⚠ WHY THIS HOOK EXISTS AT ALL — the first version of this guard swept only at OnWorldLoad, and that
; does not cover the case that actually killed the server. The nulls arrive when a blueprint carrying
; unresolvable references is PASTED, which happens mid-session, long after the load sweep. Sweeping at
; the save instead puts the check on exactly the frame the crash callstack names
; (SaveWorldEndOfFrame -> SaveLevelState -> GenerateSaveObjects -> the null deref).
;
; READ-ONLY USE of UFGSaveSession itself: the hook reads nothing from it and writes nothing to it. It
; exists only to get a callback at the right moment, and it FALLS THROUGH — the save always proceeds.
; Cancelling a save to dodge a crash would trade a crash for silent data loss, which is worse.
Friend=(Class="UFGSaveSession", FriendClass="FFPMWireNullGuard")

; mCircuits and mReplicatedCircuits are both PRIVATE on AFGCircuitSubsystem (FGCircuitSubsystem.h:251
; and :259). There is no public enumerator — FindCircuit(int32) (:84) is public but needs an id you can
; only get from the containers themselves.
;
; ⚠ BOTH ARE READ, AND THAT IS NOT REDUNDANCY. mCircuits is a TMap, and the header states at :257 that
; a TMap cannot replicate, which is precisely why mReplicatedCircuits exists beside it. On a joining
; CLIENT the map is empty and only the array is populated. A probe reading the map alone would report
; "no circuits" on the exact machine where the "Fuse Blown" popup is being complained about, and that
; zero would look like an answer instead of an absence.
;
; ⚠ READ-ONLY, AND IT MATTERS MORE HERE THAN USUAL. This probe never calls ResetFuse, never writes
; mIsFuseTriggered, and never touches a circuit. Its whole job is to decide whether the vanilla warning
; is lying BEFORE anything is suppressed — two research passes found the vanilla graph never reads the
; payload it is handed, which makes a false positive plausible, and plausible is not measured. If a
; circuit really is tripped, that warning is doing its job and hiding it would hide a real fault.
;
; The friend is the FIX CLASS, per this file's convention — the reads happen inside a lambda defined in
; FFPMPowerWarningProbe's translation unit, which carries the enclosing class's access.
Friend=(Class="AFGCircuitSubsystem", FriendClass="FFPMPowerWarningProbe")

; mBlueprintDescriptorsRequireRefresh is PRIVATE on AFGBlueprintSubsystem (FGBlueprintSubsystem.h:697,
; under the `private:` at :651). It is vanilla's OWN dirty flag — the public setter
; MarkBlueprintDescriptorsForRefresh() (:213) sets it, and there is no getter of any kind.
;
; ⚠ READ-ONLY, AND THAT IS THE ENTIRE POINT OF THE FIX. The sweep gate cancels the every-2-seconds
; O(library) recipe re-verification (:201) ONLY when nothing that feeds the answer has moved. This flag
; is one of the two inputs it must read to know that; the other is the available-recipe count. Reading
; it is what makes the cancellation provably safe rather than merely usually safe.
;
; The gate NEVER writes it. Clearing vanilla's dirty flag would make the game skip a refresh IT had
; decided to do, which is the mod-that-disables-the-loop failure this fix exists to avoid.
;
; A size check on the descriptor list is done as well and is NOT a substitute: an import plus a delete
; in the same window leaves the count identical while the set has changed, and only the flag sees that.
;
; The friend is the FIX CLASS, per this file's convention — the read happens in
; FFPMBlueprintSweepGate::ShouldCancelSweep, so that member carries the access.
Friend=(Class="AFGBlueprintSubsystem", FriendClass="FFPMBlueprintSweepGate")

; ⚠ THE FIRST ENTRY HERE THAT IS NOT A FactoryGame CLASS. The rule stated at the top of this file is
; "every remaining entry targets a FactoryGame class, keep it that way" — but the REASON behind that
; rule is what actually governs, and the reason is narrower than the phrasing: a Friend= only works
; where THIS PROJECT'S UHT regenerates the target's generated header. AbstractInstance qualifies.
; The engine does not. Read from disk 2026-08-10:
;
;   Plugins/AbstractInstance/Intermediate/Build/Win64/FactoryGame/UHT/AbstractInstanceManager.generated.h
;       dated 2026-08-03 — regenerated by this project's own builds.
;   <engine>/Intermediate/.../Inc/Engine/UHT/GameMode.generated.h
;       dated 2026-06-02 — ships with the install and is never regenerated here, which is why the two
;       engine entries removed above were inert from the day they were written.
;
; So the discriminator is "does our UHT rebuild it", and "FactoryGame class" was a proxy for that. A
; clean compile is the receipt either way — accessing a protected member cannot compile without this.
;
; InstanceMap is PROTECTED on AAbstractInstanceManager (AbstractInstanceManager.h:210, under the
; `protected:` at :199, before the `private:` at :237). There is no public enumerator of any kind.
;
; ⚠ READ-ONLY, AND WHAT IT READS IS AN INTENT THE COMPONENT ITSELF NO LONGER CARRIES.
; UInstancedStaticMeshComponent::bAffectDistanceFieldLighting is runtime state that keeps no record of
; what it was authored to be, so a component reading `false` is indistinguishable from a defect —
; unless you can reach FInstanceComponentData::InstanceData.bCastDistanceFieldShadows (InstanceData.h:67,
; UPROPERTY EditDefaultsOnly, default true), which is the per-mesh CONTENT setting. On Ant's save 32-37%
; of components read false, and without this entry the audit cannot say which of those CSS meant.
;
; That is not a nicety. The repair path used to set the flag on every component it found clear, which
; on her save would have overridden roughly a million deliberately-authored-off instances — against a
; GPU already measured at 98%.
;
; The audit never writes InstanceMap, never adds or removes an entry, and never holds a component
; pointer past the call: pointers go in as map KEYS and are never dereferenced, so a stale one can only
; fail to match, never crash.
;
; The friend is the FIX CLASS, per this file's convention — the read happens in
; FFPMDistanceFieldAudit::BuildProvenance, so that member carries the access.
Friend=(Class="AAbstractInstanceManager", FriendClass="FFPMDistanceFieldAudit")
