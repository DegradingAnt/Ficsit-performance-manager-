[AccessTransformers]

; InactivePlayerArray is protected on AGameMode (Engine GameMode.h:138) and there is NO public
; enumerator for it. The clone sensor's entire value is naming the candidate states the vanilla matcher
; CONSIDERED and what each one scored — without this friend it could only report the winner, which is
; the one fact the server log already gives us:
;   "Substracting identity of player known as (SunFry) from player state with last known name of ()."
; Proving why the real state loses needs the whole candidate list, not the result.
;
; Access transformers are the docs-recommended route over stringly-typed FProperty reflection, because
; they fail at BUILD time if the engine ever renames the field rather than silently at runtime.
;
; ⚠ READ-ONLY USE. The sensor iterates this array to score and print. It never writes it, never removes
; from it, and never touches an AFGCharacterPlayer. FPM NEVER DESTROYS PLAYER CHARACTERS — that is the
; standing law, and it was earned by eight inventory losses.
;
; The friend is the FIX CLASS, not the UE module class. The sensor's handlers are lambdas defined
; inside FFPMCloneSensor::Arm(), and a lambda in a member function carries its enclosing class's access.
Friend=(Class="AGameMode", FriendClass="FFPMCloneSensor")

; mCachedAttachmentPoints is protected on AFGBuildableHologram (FGBuildableHologram.h:523) and — unlike
; almost everything else we reach for — it is NOT a UPROPERTY, just a plain TArray. So FProperty
; reflection is not even an available fallback here; the friend is the only route.
;
; ⚠ THIS ONE WRITES, which is a real difference from the read-only sensor above. The array is derived
; locally during the placement flow and never replicated, so an observer's network-received build
; preview arrives with the attachment-point COMPONENTS present and the cache that summarises them
; empty. ModularStations' carousel hologram asserts on that emptiness and kills the joining client. We
; rebuild the cache from those components and let BeginPlay run.
;
; Writing it is safe because a ROLE_SimulatedProxy never makes a placement decision — snapping is
; resolved on the owning machine and committed by the server — so the cache on an observer copy is read
; only by code that expects it populated. The alternative, which shipped for two weeks, was cancelling
; DispatchBeginPlay outright; that also skipped every COMPONENT's BeginPlay, and Ant confirmed the cost
; first-hand: "sometimes the holograms never rendered when sunfry held them in front of me."
Friend=(Class="AFGBuildableHologram", FriendClass="FFPMHologramNetGuard")

; mDefaultInventorySize is protected on UFGInventoryComponent (FGInventoryComponent.h:622). It is the
; authored slot count an inventory is supposed to have, and reading it is what lets the init guard
; REPAIR a zero-slot inventory instead of refusing the items headed into it.
;
; Ant, 2026-08-08, on the old guard's Override(0): "we cant delete items. illegal. we need to not make
; zero inventory crates at all. it needs to be fixed at the source, not a bandaid solution."
;
; ⚠ READ-ONLY. The guard reads this to learn the intended size, then calls the PUBLIC Resize()
; (FGInventoryComponent.h:203) to apply it. It never writes the field.
Friend=(Class="UFGInventoryComponent", FriendClass="FFPMInventoryInitGuard")

; TileNumberHardLimit is protected on the engine's ARecastNavMesh (RecastNavMesh.h, section at :490).
; P3.4 must write it on the PLACED actors, not just the class default -- the old mod wrote only the CDO,
; logged "65536 -> 524288", and the engine was still reporting serialized maxTiles 65536 twenty-two
; seconds later. Its own caveat had predicted exactly that: a placed actor's serialized value beats the
; CDO.
;
; The friend is the FIX CLASS, per this file's convention -- the write happens in
; FFPMNavMeshCeiling::OnWorldLoad, so that member carries the access.
Friend=(Class="ARecastNavMesh", FriendClass="FFPMNavMeshCeiling")

; mWires is non-public on UFGCircuitConnectionComponent (FGCircuitConnectionComponent.h:184,
; `TArray<TObjectPtr<AFGBuildableWire>> mWires`). The public accessors are both named GetWires (:72,
; :73) and they APPEND INTO A COPY — so they can tell you a null exists and can never remove it. The
; sibling `uint8 mNumWiresConnected` (:188) is read through the same friend.
;
; ⚠ THIS ONE WRITES, and it earned the right the hard way. On 2026-08-09 at 21:42:41 a null entry in
; one of these arrays SIGSEGV'd the DEDICATED SERVER inside its autosave — UClass::ImplementsInterface
; on a null class, called from FFastSaveReferenceCollector::HandleObjectReference (FGSaveSession.cpp:
; 2577) — with two players connected, and autosaves had been silently failing before that.
;
; What it writes is deliberately the narrowest possible thing: RemoveAll of entries that are EXACTLY
; nullptr. It never destroys an AFGBuildableWire, never touches a buildable, a player character or an
; item, and never writes an ini. A null slot is a hole where an object used to be, not a player's
; property — which is why this does not collide with "we cant delete items. illegal."
; mNumWiresConnected is READ AND REPORTED BUT NEVER WRITTEN: its exact semantics (array slots, or only
; wires connected at both ends?) are unverified, and writing on that uncertainty is the class of guess
; this project keeps paying for.
;
; FPM.WireGuard.Repair 0 returns it to report-only without losing the half that names the culprit.
;
; The friend is the FIX CLASS, per this file's convention — the access happens in
; FFPMWireNullGuard::SweepWorld, so that member carries it.
Friend=(Class="UFGCircuitConnectionComponent", FriendClass="FFPMWireNullGuard")
